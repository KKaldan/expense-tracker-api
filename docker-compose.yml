services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost tests a TCP connection, as the api makes. Without it,
      # pg_isready uses the Unix socket, which the temporary first-boot init
      # server accepts — so the check could pass before Postgres is reachable.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env — inside the compose
      # network the DB is reached via the "postgres" service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-expense_tracker}
      # env_file values override the image's ENV, so without this a .env
      # copied from .env.example would silently run the container in development.
      NODE_ENV: production
    ports:
      - "3000:3000"
    # exec replaces the shell with node, so node becomes PID 1 and receives
    # SIGTERM from `docker compose down` — sh would not forward it, and the
    # graceful shutdown in server.js would never run.
    command: sh -c "npm run migrate && exec node server.js"

volumes:
  pgdata:
